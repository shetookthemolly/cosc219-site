  <!-- A navbar that collapses on small screens.
       You need .navbar, .navbar-toggler and .navbar-collapse, wired with the
       data-bs-* attributes. Bootstrap's JavaScript does the rest. -->


  <!-- The page content, in a .container.

       A .row with:
         · a search text field   col-12 col-md-6
         · a rating select       col-12 col-md-4
         · a Load button         col-12 col-md-2
       Gutters with g-3, not margins of your own.
       Every control needs a real <label> — form-label is styling, not a label. -->


  <!-- The four state panels. Give each one an id so you can show and hide it,
       and start them all with d-none.

         #state-loading   a .spinner-border, with .visually-hidden text inside
         #state-error     an .alert.alert-danger
         #state-empty     a message
         #state-loaded    the .row that holds the cards, using
                          row-cols-1 row-cols-md-2 row-cols-lg-3 -->


  <!-- Bootstrap's JavaScript bundle goes here, at the end of the body. -->
